name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Production build
        env:
          VITE_API_BASE_URL: https://inventory-api.example.com/api/v1
          VITE_PASSWORD_RESET_ENABLED: 'false'
        run: npm run build
